name: Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install documentation dependencies
        run: pip install -r requirements-dev.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Install PDF browser
        run: sudo apt-get update && sudo apt-get install --yes chromium

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Mermaid CLI
        run: npm install --global @mermaid-js/mermaid-cli@11.4.1

      - name: Build PDF
        run: python scripts/build_pdf.py

      - name: Build presentation slides
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: docs/presentation
          root_file: slides.tex

      - name: Copy slides into the site
        run: cp docs/presentation/slides.pdf site/presentation.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cloud-file-service-pdfs
          path: |
            site/cloud-file-service.pdf
            site/presentation.pdf

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
