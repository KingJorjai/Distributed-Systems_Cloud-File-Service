site_name: Cloud File Service
site_description: Automatic one-way file synchronization between a client and a multithreaded server.
site_url: https://kingjorjai.github.io/Distributed-Systems_Cloud-File-Service/
repo_url: https://github.com/KingJorjai/Distributed-Systems_Cloud-File-Service
repo_name: KingJorjai/Distributed-Systems_Cloud-File-Service
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_options:
              warn_missing_types: false
            members_order: source
            show_source: true
            show_root_heading: true
            show_object_full_path: false
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist

nav:
  - Home: index.md
  - Getting Started:
      - Quick Start: quick-start.md
      - Configuration: configuration.md
      - Docker: docker.md
  - Concepts:
      - Architecture: architecture.md
      - Protocol: protocol.md
      - Limitations: limitations.md
  - API Reference:
      - Sync Client: api/sync-client.md
      - Server: api/server.md
      - Protocol Helpers: api/protocol.md
