services:
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: cloud-file-service-server
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "${SERVER_PUBLISHED_PORT:-6012}:6012"
    volumes:
      - "${SERVER_DATA_PATH:-./files}:/app/files"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    image: cloud-file-service-client
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: ["server", "6012", "/data"]
    depends_on:
      server:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true
    volumes:
      - "${CLIENT_DATA_PATH:-./client_files}:/data"
