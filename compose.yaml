services:
  server1:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: "${IMAGE_PREFIX:-ghcr.io/kingjorjai/distributed-systems-cloud-file-service}-server:${IMAGE_TAG:-latest}"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    ports:
      - "${SERVER_PUBLISHED_PORT:-50012}:${SERVER_INTERNAL_PORT:-50012}"
    environment:
      CONFIG_FILE: /app/config.toml
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "${SERVER_INTERNAL_PORT:-50012}"
      SERVER_FILES_PATH: /app/files
      SERVER_ID: server1
      SERVER_ROLE: primary
      SERVER_PEERS: "server2@server2:60012,server3@server3:60012"
      SERVER_REPLICATION_PORT: "60012"
      CLUSTER_TOKEN: "${CLUSTER_TOKEN:-change-me}"
      TLS_CERT_FILE: /app/certs/server.crt
      TLS_KEY_FILE: /app/certs/server.key
      TLS_CA_FILE: /app/certs/ca.crt
      TLS_SERVER_NAME: localhost
      APP_PASSWORD_SAR: "${APP_PASSWORD_SAR:-}"
      APP_PASSWORD_SZA: "${APP_PASSWORD_SZA:-}"
    volumes:
      - "${SERVER1_DATA_PATH:-./files/server1}:/app/files"
      - "${CERTS_PATH:-./certs}:/app/certs:ro"
      - "${APP_CONFIG_FILE:-./config.toml.example}:/app/config.toml:ro"
    depends_on:
      server2:
        condition: service_healthy
      server3:
        condition: service_healthy
    restart: unless-stopped

  server2:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: "${IMAGE_PREFIX:-ghcr.io/kingjorjai/distributed-systems-cloud-file-service}-server:${IMAGE_TAG:-latest}"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      CONFIG_FILE: /app/config.toml
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "${SERVER_INTERNAL_PORT:-50012}"
      SERVER_FILES_PATH: /app/files
      SERVER_ID: server2
      SERVER_ROLE: secondary
      SERVER_PRIMARY: "server1@server1:60012"
      SERVER_PEERS: "server3@server3:60012"
      SERVER_REPLICATION_PORT: "60012"
      CLUSTER_TOKEN: "${CLUSTER_TOKEN:-change-me}"
      TLS_CERT_FILE: /app/certs/server.crt
      TLS_KEY_FILE: /app/certs/server.key
      TLS_CA_FILE: /app/certs/ca.crt
      TLS_SERVER_NAME: localhost
      APP_PASSWORD_SAR: "${APP_PASSWORD_SAR:-}"
      APP_PASSWORD_SZA: "${APP_PASSWORD_SZA:-}"
    volumes:
      - "${SERVER2_DATA_PATH:-./files/server2}:/app/files"
      - "${CERTS_PATH:-./certs}:/app/certs:ro"
      - "${APP_CONFIG_FILE:-./config.toml.example}:/app/config.toml:ro"
    restart: unless-stopped

  server3:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: "${IMAGE_PREFIX:-ghcr.io/kingjorjai/distributed-systems-cloud-file-service}-server:${IMAGE_TAG:-latest}"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      CONFIG_FILE: /app/config.toml
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "${SERVER_INTERNAL_PORT:-50012}"
      SERVER_FILES_PATH: /app/files
      SERVER_ID: server3
      SERVER_ROLE: secondary
      SERVER_PRIMARY: "server1@server1:60012"
      SERVER_PEERS: "server2@server2:60012"
      SERVER_REPLICATION_PORT: "60012"
      CLUSTER_TOKEN: "${CLUSTER_TOKEN:-change-me}"
      TLS_CERT_FILE: /app/certs/server.crt
      TLS_KEY_FILE: /app/certs/server.key
      TLS_CA_FILE: /app/certs/ca.crt
      TLS_SERVER_NAME: localhost
      APP_PASSWORD_SAR: "${APP_PASSWORD_SAR:-}"
      APP_PASSWORD_SZA: "${APP_PASSWORD_SZA:-}"
    volumes:
      - "${SERVER3_DATA_PATH:-./files/server3}:/app/files"
      - "${CERTS_PATH:-./certs}:/app/certs:ro"
      - "${APP_CONFIG_FILE:-./config.toml.example}:/app/config.toml:ro"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: docker/client.Dockerfile
    image: "${IMAGE_PREFIX:-ghcr.io/kingjorjai/distributed-systems-cloud-file-service}-client:${IMAGE_TAG:-latest}"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: ["server1", "${SERVER_INTERNAL_PORT:-50012}", "/data"]
    depends_on:
      server1:
        condition: service_healthy
    environment:
      CONFIG_FILE: /app/config.toml
      CLIENT_SERVER: server1
      CLIENT_PORT: "${SERVER_INTERNAL_PORT:-50012}"
      CLIENT_LOCAL_PATH: /data
      CLIENT_TLS_CA_FILE: /app/certs/ca.crt
      CLIENT_TLS_SERVER_NAME: server1
      PYTHONUNBUFFERED: "1"
    stdin_open: true
    tty: true
    volumes:
      - "${CLIENT_DATA_PATH:-./client_files}:/data"
      - "${CERTS_PATH:-./certs}:/app/certs:ro"
      - "${APP_CONFIG_FILE:-./config.toml.example}:/app/config.toml:ro"
